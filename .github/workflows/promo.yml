name: Promo screenshots

on:
  push:
    branches: [promo-tmp]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore engine
        id: aarcache
        uses: actions/cache/restore@v4
        with:
          path: app/libs
          key: engine-v1-${{ hashFiles('engine/**') }}

      - name: Build engine
        id: engine
        if: steps.aarcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs app/libs
          {
            export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
            echo "NDK: $ANDROID_NDK_HOME"
            go version
            go install golang.org/x/mobile/cmd/gomobile@latest
            go install golang.org/x/mobile/cmd/gobind@latest
            export PATH="$PATH:$(go env GOPATH)/bin"
            gomobile init
            cd engine
            go get go.mau.fi/mautrix-gmessages@9567716bccd9da0d626a293d799629fec0ad6afd
            go get -tool golang.org/x/mobile/cmd/gobind
            go mod tidy
            grep -n "mobile" go.mod
            go vet ./...
            gomobile bind -v -target=android/arm64,android/amd64 -androidapi 29 \
              -javapkg=com.jpetrydesign.pyng -o ../app/libs/engine.aar .
            ls -la ../app/libs
          } 2>&1 | tee ci-logs/engine.log

      - name: Build app
        shell: bash
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk pyng.apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/promo.sh pyng.apk

      - name: Save
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/out && cp -r promo-out/* /tmp/out/ 2>/dev/null || true
          git config user.name "pyng-ci"
          git config user.email "pyng-ci@users.noreply.github.com"
          git checkout --orphan promo-shots-tmp
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/* . 2>/dev/null || echo "no shots" > none.txt
          git add -A
          git commit -m "Promo shots"
          git push -f origin HEAD:promo-shots
